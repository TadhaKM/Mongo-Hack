[project]
name = "rentcheck-agents"
version = "0.1.0"
description = "RentCheck AI agent layer: evidence-backed rental analysis on top of the RentCheck backend tools"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=2.28,<3",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rentcheck_agents*"]

[tool.setuptools.package-data]
rentcheck_agents = ["tools/fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
