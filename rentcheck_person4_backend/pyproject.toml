[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rentcheck-person4-backend"
version = "0.1.0"
description = "mend.ai backend and Irish open-data ingestion framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pymongo>=4.8,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "python-dateutil>=2.9,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
  "orjson>=3.10,<4",
  "rapidfuzz>=3.9,<4",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "mongomock>=4.2,<5",
  "zeep>=4.3,<5",
  "google-genai>=2.28,<3",
  "python-dotenv>=1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
